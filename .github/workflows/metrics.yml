name: Metrics

on:
  # Daily refresh so the badge stays current without me lifting a finger.
  schedule:
    - cron: "0 6 * * *"
  # Manual run from the Actions tab.
  workflow_dispatch:
  # Regenerate immediately after a README tweak.
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ── Main overview card (right column of the README). ──
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Europe/Paris
          config_padding: 0, 8 + 6%
          plugin_lines: yes
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_traffic: yes

      # ── Top languages card (centered footer of the README). ──
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          base: ""
          config_timezone: Europe/Paris
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, dockerfile, makefile, shell, jupyter notebook
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 30
